[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lqabr-core"
version = "0.1.0"
description = "LQABR shared core: lead profile types, probability engine, Secret Manager access, CRM (HubSpot) adapter."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
gcp = ["google-cloud-secret-manager>=2.20"]
test = ["pytest>=8", "responses>=0.25"]
# The lqabr_core.leadgen.server MCP front door (the "second door" to the same
# two HubSpot tools). Only needed to run/serve the MCP server, not to import
# the in-process leadgen.hubspot layer.
mcp = ["mcp>=1.9.0"]

[project.scripts]
lqabr-mcp-server = "lqabr_core.leadgen.server:main"

[tool.setuptools.packages.find]
include = ["lqabr_core*"]
