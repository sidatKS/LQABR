[pytest]
# NOTE: this file no longer sits at the repo root, so pytest will not
# discover it automatically. Invoke the suite as:
#     python3 -m pytest -c tests/pytest.ini -q
# rootdir becomes this directory, so testpaths are relative to tests/.
testpaths =
    ../packages/lqabr_core/tests
    ../mcp/tests
    ../agents/ingestion/tests
    ../agents/lead_profile/tests
    ../agents/email/tests
    ../agents/text_voice/tests
    ../agents/scheduling/tests
    ../agents/orchestrator/tests
    ../agents/gateway/tests
    .
norecursedirs = .git .venv data docs infra
