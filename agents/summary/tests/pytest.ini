[pytest]
# This agent's suite runs STANDALONE — it is not in the repo-root
# tests/pytest.ini testpaths, and it needs nothing installed from
# packages/ or mcp/. Invoke it as:
#
#     python3 -m pytest -c agents/summary/tests/pytest.ini -q
#
# rootdir becomes this directory, so the paths below are relative to it.
testpaths = .
pythonpath = .. ../packages ../src
addopts = -ra
asyncio_mode = auto
norecursedirs = .git .venv node_modules ../ui ../docs
