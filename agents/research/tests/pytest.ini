[pytest]
# This agent's suite runs STANDALONE — it needs nothing installed from
# packages/ or mcp/, and nothing from another agent.
#
# Invoke it with the PATH GIVEN EXPLICITLY:
#
#     python3 -m pytest agents/research/tests -c agents/research/tests/pytest.ini -q
#
# `testpaths` is deliberately NOT set: with -c from the repo root it resolves
# against the INVOCATION directory, not this file's directory, so `testpaths = .`
# collects the whole repo. Passing the path is unambiguous.
#
# import-mode=importlib because several agents name a test file the same thing
# (test_schema.py, test_settings.py, test_pipeline.py). Under the default
# prepend mode those basenames collide on import and collection fails.
pythonpath = .. ../packages ../src
addopts = -ra --import-mode=importlib
asyncio_mode = auto
norecursedirs = .git .venv node_modules docs
