# =====================================================================
# Agent Gateway — central tunables
# ---------------------------------------------------------------------
# Rev 3, "Customization — config file & variable": which protocols are on,
# audit verbosity, lead-profile chunk-size hint, timeouts. One file, no code
# changes to adjust behaviour.
#
# Secrets do NOT live here — see config/.env.example.
# Routing lives in config/agents_registry.yaml, not here.
# =====================================================================

gateway:
  name: agent-gateway
  version: "0.1.0"

  # Step 2 — the single HTTP ingress. The only entry point for HubSpot
  # events; no agent-to-agent traffic passes through it.
  ingress:
    path: /hubspot/events
    # Host and port are NOT set here: uvicorn binds them and Cloud Run injects
    # PORT. A second source of truth for the bind address is a config key that
    # looks authoritative and is silently ignored.

    # HubSpot batches up to 100 events per POST (Rev 3, "What the trigger
    # emits" → Transport). A larger array is a protocol violation, not a
    # workload to absorb.
    max_batch_size: 100

    # HubSpot's default throttle is 10 concurrent requests. Rev 3 Step 2
    # System log: "ingress concurrency against the throttle limit of 10".
    # This is the concurrency the gateway must absorb, so it is a bound we
    # hold ourselves rather than a limit we hope HubSpot respects.
    max_concurrent_requests: 10

    # Signature verification of the inbound webhook. Not named in Rev 3,
    # added because the ingress is a public HTTPS endpoint: without it
    # anyone who learns the URL can inject routing triggers.
    # Secret: HUBSPOT_APP_SECRET (private-app client secret).
    signature:
      # MUST stay true. This is the ONLY thing defending a public ingress that
      # can start outreach (gateway_deploy_spec 4.2). Was false for local dev
      # 2026-08-21; deploying that value leaves the door open. It cannot be an
      # env flag: every boolean here is read with bool(), and env interpolation
      # yields strings, so ${VAR:-false} evaluates TRUE (gateway_deploy_spec 5).
      # For local dev without a secret, edit this to false and do not commit.
      enabled: true
                       # Re-enable with the private-app client secret before prod.
      header: X-HubSpot-Signature-v3
      timestamp_header: X-HubSpot-Request-Timestamp
      # HubSpot rejects/replays outside 5 minutes; match it.
      max_age_seconds: 300

# ---------------------------------------------------------------------
# Vapi end-of-call report relay — the gateway's SECOND inbound path.
#
# Not a trigger. When a Vapi call ends, Vapi POSTs the full report (transcript,
# recording URL, ended reason) to the gateway, which forwards it UNCHANGED to
# the Text/Voice agent. It bypasses the router, the dedupe store and the A2A
# payload guard on purpose — see src/call_report.py for why.
#
# The gateway is in this path because lqabr-dev-txtv is deployed private and
# Vapi cannot present a Google identity token. The gateway is the public front
# door, and it owns provider authenticity: txtv's /call-report handler performs
# NO secret verification of its own.
#
# Target: LQABR_VOICE_REPORT_URL   Secret: LQABR_VAPI_WEBHOOK_SECRET
# ---------------------------------------------------------------------
vapi:
  report:
    enabled: false   # MVP: no gateway relay of Vapi reports
    # Must match the assistant's Server URL in the Vapi dashboard, which is
    # {GATEWAY_BASE_URL}/call-report. Confirmed against txtv's OpenAPI
    # (POST /lead, POST /call-report, GET /healthz) on 2026-08-04.
    path: /call-report
    # txtv classifies and writes to HubSpot inside this call, so allow more
    # than a trigger hand-off would need.
    timeout_seconds: 30
    signature:
      # Verified HERE, not downstream. Set false only for local testing
      # against a stub — with it off, this endpoint is genuinely open.
      enabled: true
      header: x-vapi-secret

# Protocols handled by the co-located runtime (lib/soloai over agentgateway).
protocols:
  a2a:
    enabled: true                 # gateway -> agent hand-off, Step 4
    timeout_seconds: 30
    max_retries: 2                # total attempts = 1 + max_retries
    backoff_seconds: 0.5          # exponential: 0.5s, 1.0s
    # NOTE: dispatch targets whatever the agent's `endpoint_env` resolves to in
    # agents_registry.yaml — there is no separate base-URL setting here, on
    # purpose, so there is exactly one place an agent's address is defined.
    # To route through the sidecar (and get its access log / OTel span for the
    # hop), point those env vars at it: http://127.0.0.1:3000/a2a/<agent>.
    # To bypass it, point them straight at the agent. Both are config, not code.

  mcp:
    enabled: true
    # The gateway does NOT proxy profile data. Step 6 is agent -> HubSpot,
    # direct, bypassing the gateway. This block exists so the sidecar can
    # publish one MCP endpoint for the agents and so the chunk hint has a
    # home, per Rev 3's config.yaml responsibilities.
    sidecar_base_url: http://127.0.0.1:3000
    proxy_profile_data: false     # must stay false — see FR "trigger-only payload"

# Rev 3 FR-7. Four streams, collected to the runtime's own logging standard.
audit:
  # terse | normal | debug -- same three tiers, same names, as
  # LQABR_RESEARCH_LOG_MODE / LQABR_SUMMARY_LOG_MODE.
  # Normal mode: leave LQABR_GATEWAY_LOG_MODE unset (defaults to "normal").
  # Debug mode:  LQABR_GATEWAY_LOG_MODE=debug before starting uvicorn --
  #              unlocks per-event discard detail on the process stream.
  mode: ${LQABR_GATEWAY_LOG_MODE:-}
  # DEPRECATED -- old minimal|standard|verbose naming. Still read (mapped onto
  # `mode` above, with a one-time system-stream notice) if `mode` /
  # LQABR_GATEWAY_LOG_MODE is unset. New deployments should use `mode`.
  level: ${LQABR_GATEWAY_LOG_LEVEL:-}
  sink: file                      # LOCAL DEV: native file log under logs/gateway/
  file_path: ./logs/gateway/gateway.jsonl # relative to CWD -> run uvicorn from repo root
  # auto | text | json | off -- console shape when sink: file (the file
  # itself is always full JSON regardless, same guarantee research makes for
  # logs/agents/research/agent.log). auto = human-readable text only when a
  # real terminal is attached; silent otherwise (Cloud Run, a pipe).
  console_format: ${LQABR_GATEWAY_CONSOLE_FORMAT:-auto}
  # Where the three per-stream files (gateway_process.log, gateway_audit.log,
  # gateway_system.log) go. Relative resolves against the repo root. Defaults
  # to ./logs/gateway -- the SAME folder as file_path above, so the main sink
  # (gateway.jsonl) and the three per-stream files all live together in one
  # place, logs/gateway.
  log_dir: ${LQABR_GATEWAY_LOG_DIR:-./logs/gateway}
  # Bytes before a file rolls over (main sink + all three per-stream files);
  # 0 disables rotation. Same default and backup count as research (~50 MB,
  # 5 backups) -- at gateway volumes this will rarely if ever fire.
  log_max_bytes: ${LQABR_GATEWAY_LOG_MAX_BYTES:-52428800}
  log_backups: ${LQABR_GATEWAY_LOG_BACKUPS:-5}
  streams:
    audit: true                   # network activity: where from, when, which endpoint
    process: true                 # the routing decision + property/value behind it
    system: true                  # container activity: memory, concurrency, exceptions
    token_model: false            # N/A to the gateway — explicit exclusion, not an omission
  # Belt-and-braces on the trigger-only guarantee: any attempt to log one of
  # the nine lead parameters raises instead of writing.
  forbid_profile_fields: true

# Served to agents over MCP (Step 6). The gateway never holds profile data —
# this is a hint it publishes, not a payload it carries.
lead_profile:
  chunk_size_hint: 5              # ~5 profiles per trigger, bounds agent memory

# Step 2 — "De-duplicate using eventId where attemptNumber > 0".
dedupe:
  enabled: true
  # HubSpot retries a failed delivery for up to 24h, so a 15-minute memory would
  # let a late redelivery of an already-dispatched event through and contact the
  # lead a second time. Only successful hand-offs are stored (never discards),
  # so the entry count stays low enough to hold a full day.
  ttl_seconds: 86400
  max_entries: 10000              # LRU cap; in-memory, per instance (see README)

# Step 2 — "Ignore events whose changeSource is an agent write-back".
loop_guard:
  # self_trigger (default): drop an event only when the agent that owns the
  #   route is the same agent that writes the property that fired it. This is
  #   what "so the system does not trigger itself" actually requires.
  # all_api: the literal Rev 3 reading — drop every changeSource in
  #   ignored_change_sources. WARNING: this disables three of the four
  #   configured routes, because contact.creation, email_status and
  #   voice_status are all written by agents via the API. See D-03.
  mode: self_trigger
  ignored_change_sources: [API]   # applied only when mode: all_api

# Step 4 — hand-off.
dispatch:
  # Off by default: Rev 3 says "send trigger_id only". Turning this on adds the
  # route id to the A2A metadata so an agent can log why it was woken — nothing
  # else. propertyName/propertyValue stay off the wire regardless (a property
  # value is config-controlled: subscribe to a profile property in the portal and
  # it arrives holding an email address). objectId DOES travel, always - it is
  # what the agent resolves the lead with (D-05). The audit trail carries the
  # full basis either way, so leave this false unless an agent needs it.
  include_routing_basis: false

  # How many leads travel in one hand-off.
  #
  #   per_lead  one A2A call per lead. Today's behaviour, and the default:
  #             an existing deployment is unchanged until this is set.
  #   grouped   the routed decisions of ONE ingress are grouped by target
  #             agent and chunked at batch_size, so 20 leads that arrived in
  #             one HubSpot delivery become one call per agent, not 20.
  #
  # grouped never waits: it batches what already arrived together and sends.
  # HubSpot decides how many that is (up to 100 events per POST), so this is
  # "up to batch_size", never a guaranteed batch_size.
  #
  # Env override: LQABR_DISPATCH_MODE, LQABR_BATCH_SIZE — these are deployment
  # variables so the mode can change with --set-env-vars, not a release.
  mode: per_lead
  batch_size: 20

  # The hand-off happens before we respond to HubSpot, so a 200 means
  # "dispatched" and the 503 retry path is meaningful. Deliberately not a
  # setting: a fire-and-forget mode would make the status code a lie.

# =====================================================================
# Step 4 (Rev 5) — Audience resolution. The gateway reads HubSpot to turn one
# blog-summary Ticket into the leads it targets (D-08). When disabled it falls
# back to Step-1 behaviour. Token comes from HUBSPOT_PRIVATE_APP_TOKEN only.
# =====================================================================
audience:
  enabled: false
  industry_property: blog_industry   # Ticket property naming the target industry
  blog_route_id: R-blog-summary      # which route triggers resolution
  page_size: 100                     # HubSpot search page size (max 100)
  max_audience: 1000                 # ceiling on leads per post (bounded fan-out)
  timeout_seconds: 8                 # per HubSpot call; within the 5s ingress budget
