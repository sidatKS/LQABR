# =====================================================================
# Agent Gateway — routing map
# ---------------------------------------------------------------------
# Rev 3: "Declarative property + value -> agent mapping used by router.py
# and audit.py; onboarding a new agent means editing this file, not the
# routing code."
#
# Event -> agent mapping (Rev 3, page 1):
#   Lead-context written        -> Email agent
#   Email status: opened       -> Voice agent
# plus Contact Created -> Email agent (subscribed in addition to
# lead_context, because a property set at creation time may not raise a
# separate property-change event).
# =====================================================================

version: 1

# The three active HubSpot private-app webhook subscriptions this map serves.
# Portal 246777241, Contact object. Documentation only — the gateway does not
# create subscriptions; they are configured in the portal.
subscriptions:
  - object: contact
    event: contact.creation
  - object: contact
    event: contact.propertyChange
    property: lead_context
  - object: contact
    event: contact.propertyChange
    property: lqabr_email_status
  - object: ticket
    event: ticket.propertyChange
    property: blog_summary

# ---------------------------------------------------------------------
# Downstream agents. `endpoint_env` keeps URLs out of the repo and lets the
# same registry ship to dev / stage / prod unchanged (Rev 3: swapping an
# agent implementation is a URL change, never a code edit).
#
# `writes` declares the properties each agent writes back to HubSpot. The
# loop guard uses it: an agent is never triggered by its own write-back.
# ---------------------------------------------------------------------
agents:
  email:
    description: Email Agent — first-touch outreach (Mailgun)
    endpoint_env: LQABR_EMAIL_AGENT_URL
    enabled: true
    writes:
      - lqabr_email_status

  voice:
    description: Text/Voice Agent — SMS + programmable voice (Twilio / Vapi)
    endpoint_env: LQABR_TEXT_VOICE_AGENT_URL
    enabled: true
    writes:
      - lqabr_voice_status

  research:
    description: Research Agent - fuses blog summary + lead profile into lead_context
    endpoint_env: LQABR_RESEARCH_AGENT_URL
    enabled: true
    writes:
      - lead_context

# ---------------------------------------------------------------------
# Routes, evaluated top to bottom; first match wins.
#
#   subscription_type : optional filter on the event's subscriptionType
#   property          : propertyName to match (omit for creation events)
#   values            : the routing condition. A subscription fires on EVERY
#                       value of the watched property, so anything not listed
#                       here is discarded by the gateway (D-01: the free tier
#                       has no custom trigger, so value filtering lives here).
#   match             : exact_ci (default) | exact | any
#   agent             : owning agent key from `agents` above
# ---------------------------------------------------------------------
routes:
  # R1-contact-created -- DISABLED 25-Aug-2026 at Saroja's instruction: email
  # should trigger only off lead_context, not off contact creation. The
  # HubSpot contact.creation webhook subscription is left as-is in the
  # portal (see `subscriptions:` above) -- those events still arrive at
  # /hubspot/events, they just no longer match any route here and are
  # discarded as no_matching_route. Route has no `enabled:` flag (Route
  # dataclass in router.py doesn't support one), so "disabled" means
  # commented out, not present in the list Router.route_batch() sees.
  # - id: R1-contact-created
  #   description: >
  #     New lead record inserted by the lead-profile agent. Subscribed in
  #     addition to lead_context because a property set at creation time may
  #     not raise a separate property-change event.
  #   subscription_type: contact.creation
  #   match: any                    # a creation event carries no property/value
  #   agent: email

  - id: R2-lead-context
    description: >
      Research agent wrote lead_context onto the Contact (Rev 5). Any non-empty
      value hands the lead to the Email agent. Replaces the decision_maker route;
      lead_context is a dedicated property, not HubSpot's shared message field.
    subscription_type: contact.propertyChange
    property: lead_context
    values: []
    match: non_empty
    agent: email

  - id: R3-email-opened
    description: >
      Fires on every value of lqabr_email_status; the gateway acts only on
      OPENED.
    subscription_type: contact.propertyChange
    property: lqabr_email_status
    values: ["OPENED"]
    match: exact_ci
    agent: voice

  - id: R-blog-summary
    description: Blog summary written on a Ticket - campaign trigger (D-11).
    subscription_type: ticket.propertyChange
    property: blog_summary
    values: []
    match: non_empty
    agent: research
